[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gf2"
version = "0.1.0"
description = "High-performance binary (GF(2)) matrix operations for Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "gf2 authors" }
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
]
keywords = ["binary", "GF(2)", "matrix", "linear algebra", "sparse", "bitwise", "LDPC", "coding theory" ]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.0",  # Parallel test execution
  "pytest-benchmark>=4.0",  # Performance benchmarking
  "pytest-html>=4.0",  # HTML test reports
  "pytest-mock>=3.10",  # Mocking utilities
  "hypothesis>=6.90",  # Property-based testing
  "psutil>=5.9",  # Memory usage monitoring
  "memory-profiler>=0.60",  # Memory profiling
]
dev = [
  # Pinned exactly, not lower-bounded. A linter/formatter resolved by ">=" makes
  # CI's target move without a commit: ruff 0.16 began formatting Python blocks
  # inside Markdown, so a README that passed locally under 0.12 failed CI under
  # 0.16. Keep these in lockstep with .pre-commit-config.yaml.
  "ruff==0.16.6",
  "mypy==2.3.1",
  "pre-commit>=3.7",
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]
bench = [
  "matplotlib>=3.7",
  "scipy>=1.10",
  "galois>=0.3; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/kkkaan/gf2"
Source = "https://github.com/kkkaan/gf2"
Issues = "https://github.com/kkkaan/gf2/issues"

[tool.hatch.build.targets.wheel]
packages = ["gf2"]

[tool.pytest.ini_options]
addopts = [
    "-q",
    "--cov=gf2",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "8.0"
markers = [
    "unit: Unit tests for individual functions",
    "integration: Integration tests for workflows", 
    "property: Property-based tests using hypothesis",
    "performance: Performance and benchmarking tests",
    "stress: Stress tests and fuzzing",
    "slow: Tests that take longer to run",
    "memory: Memory usage and efficiency tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
indent-width = 4
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "C4", "SIM", "PIE", "TC", "PERF", "RUF100",
]
ignore = [
  "E203",  # whitespace before ':' (Black/ruff-format compatibility)
]

# Per-file ignores for math library patterns
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]  # Allow star imports in package init

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"              # Google prefers double quotes
indent-style = "space"              
skip-magic-trailing-comma = false   # Keep trailing commas (YAPF compatible)
line-ending = "native"
docstring-code-format = true        # Format code blocks in docstrings

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
split-on-trailing-comma = true


